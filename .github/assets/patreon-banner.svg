<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="PATRON ME FOR GOD'S SAKE — I deserve some freaking pennies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="50%" stop-color="#2b0a3d"/>
      <stop offset="100%" stop-color="#05001a"/>
    </linearGradient>

    <linearGradient id="rainbow" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0%"   stop-color="#ff0080"/>
      <stop offset="16%"  stop-color="#ff8c00"/>
      <stop offset="33%"  stop-color="#ffe600"/>
      <stop offset="50%"  stop-color="#00ff88"/>
      <stop offset="66%"  stop-color="#00cfff"/>
      <stop offset="83%"  stop-color="#a64dff"/>
      <stop offset="100%" stop-color="#ff0080"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0%"   stop-color="#ff424d"/>
      <stop offset="25%"  stop-color="#ffcc00"/>
      <stop offset="50%"  stop-color="#00ffd5"/>
      <stop offset="75%"  stop-color="#ff00e6"/>
      <stop offset="100%" stop-color="#ff424d"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-900 -300" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="card"><rect x="10" y="10" width="880" height="280" rx="28"/></clipPath>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="10" y="10" width="880" height="280" rx="28" fill="url(#bg)"/>
  <rect x="10" y="10" width="880" height="280" rx="28" fill="url(#grid)"/>

  <g clip-path="url(#card)">
    <!-- drifting blobs -->
    <circle cx="120" cy="60" r="110" fill="#ff0080" opacity="0.25" filter="url(#softglow)">
      <animate attributeName="cx" values="120;220;120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="250" r="130" fill="#00cfff" opacity="0.22" filter="url(#softglow)">
      <animate attributeName="cx" values="780;660;780" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="320" r="120" fill="#ffe600" opacity="0.12" filter="url(#softglow)">
      <animate attributeName="cy" values="320;270;320" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- shine sweep -->
    <rect x="-300" y="0" width="200" height="300" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1200" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- coins falling (pennies, obviously) -->
    <g font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="26">
      <text x="60"  y="-20">🪙<animate attributeName="y" values="-20;330" dur="4.2s" repeatCount="indefinite"/></text>
      <text x="200" y="-20">💸<animate attributeName="y" values="-20;330" dur="5.1s" begin="1.2s" repeatCount="indefinite"/></text>
      <text x="350" y="-20">🪙<animate attributeName="y" values="-20;330" dur="3.7s" begin="0.6s" repeatCount="indefinite"/></text>
      <text x="530" y="-20">💰<animate attributeName="y" values="-20;330" dur="4.8s" begin="2.0s" repeatCount="indefinite"/></text>
      <text x="690" y="-20">🪙<animate attributeName="y" values="-20;330" dur="4.0s" begin="0.3s" repeatCount="indefinite"/></text>
      <text x="830" y="-20">💸<animate attributeName="y" values="-20;330" dur="5.5s" begin="1.7s" repeatCount="indefinite"/></text>
    </g>

    <!-- sparkles -->
    <g fill="#fff" font-family="sans-serif" font-size="22">
      <text x="70"  y="250">✦<animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></text>
      <text x="820" y="60">✦<animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.5s" repeatCount="indefinite"/></text>
      <text x="460" y="45">✧<animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.9s" repeatCount="indefinite"/></text>
      <text x="150" y="150">✧<animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></text>
      <text x="760" y="170">✦<animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="1.1s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- animated rainbow border -->
  <rect x="10" y="10" width="880" height="280" rx="28" fill="none" stroke="url(#border)" stroke-width="6"/>
  <rect x="10" y="10" width="880" height="280" rx="28" fill="none" stroke="url(#border)" stroke-width="6" filter="url(#softglow)" opacity="0.8"/>

  <!-- copy -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="450" y="78" font-size="20" font-weight="700" letter-spacing="6" fill="#ffffff" opacity="0.85">⚠ ATTENTION, KIND HUMAN ⚠</text>

    <g filter="url(#glow)">
      <g transform="translate(450 126)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="1.2s" additive="sum" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
          <g transform="translate(-450 -126)">
            <text x="450" y="148" font-size="62" font-weight="900" letter-spacing="2" fill="url(#rainbow)">PATRON ME</text>
          </g>
        </g>
      </g>
    </g>
    <text x="450" y="196" font-size="34" font-weight="900" fill="url(#rainbow)" filter="url(#glow)">FOR GOD'S SAKE 🙏</text>

    <text x="450" y="236" font-size="19" font-weight="600" fill="#ffffff" opacity="0.9">i deserve some freaking pennies · this app is free · the dev is not</text>

    <!-- CTA pill -->
    <g>
      <rect x="330" y="250" width="240" height="30" rx="15" fill="#ff424d"/>
      <rect x="330" y="250" width="240" height="30" rx="15" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="450" y="271" font-size="16" font-weight="800" fill="#fff" letter-spacing="1">▶ patreon.com/loficafe ◀</text>
    </g>
  </g>
</svg>
